[project]
name = "asw-bot"
version = "0.1.0"
description = "Books ASW Blocks English classes the moment the daily scheduling window opens."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx[http2]>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "tenacity>=8.3",
    "rich>=13.7",
    "plotly>=5.22",
    # zoneinfo has no system tz database on Windows nor on slim Docker images.
    "tzdata>=2024.1",
]

[project.scripts]
asw-bot = "asw_bot.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-html>=4.1",
    "respx>=0.21",
    "time-machine>=2.14",
    "ruff>=0.5",
    "mypy>=1.10",
    # The mock server only runs in tests, so it is not a runtime dependency.
    "fastapi>=0.111",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# mock_server ships next to the bot so tests and scripts can import it; it is
# only imported by them, so the bot runs without the dev dependencies.
packages = ["src/asw_bot", "mock_server"]

# --- ruff -----------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "mock_server", "scripts"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # import order
    "N",       # naming
    "UP",      # modern syntax
    "B",       # likely bugs
    "C4",      # comprehensions
    "SIM",     # simplifications
    "PT",      # pytest style
    "ASYNC",   # async pitfalls
    "DTZ",     # naive datetimes: this project lives and dies by time zones
    "S",       # security (bandit)
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest works; fake tokens and passwords are expected in tests.
"tests/**" = ["S101", "S105", "S106"]

# --- mypy -----------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# plotly ships without type information.
module = ["plotly", "plotly.*"]
ignore_missing_imports = true

# --- pytest ---------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Live tests hit the real API (read-only) and never run unless asked: pytest -m live
addopts = '-ra --strict-markers --cov=asw_bot --cov-report=term-missing -m "not live"'
markers = [
    "live: read-only tests against the real ASW API (run with: pytest -m live)",
]

[tool.coverage.run]
branch = true
source = ["asw_bot"]

[tool.coverage.report]
fail_under = 85
show_missing = true
